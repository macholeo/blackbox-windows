[package]
name = "blackbox-cli"
version = "0.1.4"
edition = "2024"
description = "Flight recorder for your dev day - passive git activity tracking"
license = "MIT"
readme = "README.md"
repository = "https://github.com/brentguistwite/blackbox"
homepage = "https://github.com/brentguistwite/blackbox"
keywords = ["git", "time-tracking", "developer-tools", "productivity"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".claude/", ".planning/", ".gitignore"]

[lib]
name = "blackbox"

[[bin]]
name = "blackbox"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
etcetera = "0.8"
rusqlite = { version = "0.38", features = ["bundled"] }
rusqlite_migration = "2.4"
thiserror = "2.0"
anyhow = "1.0"
dialoguer = "0.11"
git2 = "0.20.4"
walkdir = "2.5.0"
log = "0.4.29"
env_logger = "0.11.9"
chrono = { version = "0.4.44", features = ["serde"] }
colored = "2.2"
serde_json = "1.0.149"
serde_yaml = "0.9"
csv = "1.4.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
notify = "7"
notify-rust = "4"
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["signal", "process", "user"] }
daemonize = "0.5.0"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
assert_fs = "1.1"
tempfile = "3.0"

# Config for the cargo-dist release tool
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell", "homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
tap = "brentguistwite/homebrew-tap"
publish-jobs = ["homebrew"]
